baseURL: https://sush4nt.github.io/
locale: en-us
title: Sushant Patil
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true

minify:
  disableXML: true

pagination:
  pagerSize: 10

params:
  env: production
  title: Sushant Patil
  description: "Learning notes and personal blog by Sushant Patil."
  keywords: [Blog, Learning, Notes, Portfolio]
  author: Sushant Patil
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  ShowToc: true
  TocOpen: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  homeInfoParams:
    Title: "Hi there \U0001F44B"
    Content: >
      Welcome to my corner of the internet. This is where I write down
      learning notes and thoughts as I explore new topics.

  socialIcons:
    - name: github
      url: "https://github.com/sush4nt"
    - name: linkedin
      url: "https://www.linkedin.com/in/sush4nt/"
    - name: rss
      url: "index.xml"

  assets:
    disableHLJS: true
    favicon: "favicon.svg?v=2"
    favicon16x16: "favicon.svg?v=2"
    favicon32x32: "favicon.svg?v=2"
    apple_touch_icon: "favicon.svg?v=2"
    safari_pinned_tab: "favicon.svg?v=2"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
